<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShowFM - Mini Player</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Merienda:wght@400;700&family=Montserrat:wght@400;700&family=Radio+Canada:wght@400;700&display=swap"
        rel="stylesheet">

    <script src="https://kit.fontawesome.com/bc955bc9a2.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/players.css">
</head>

<body>
    <main class="main">

        <section class="player-box" id="players">

            <!-- trance channel -->
            <div class="player">
                <div class="player__title">
                    <p>Kanał <span class="player__color">Trance</span></p>
                </div>

                <div class="player__stats">
                    <script type="text/javascript"
                        src="https://staty.portalradiowy.pl/wstats/wstats.php?var1=1&var2=13&var3=1&var4=1&var5=296&var6=FFFFFF&var7=1&var8=1&var9=13&var10=1&var11=24&var12=296&var13=FFFFFF&var14=1&var15=0&var16=14&var17=105&var18=1&var19=000000&var20=1&var27=0&var28=14&var29=1&var30=48&var31=100&var32=000000&var33=1&var34=0&var35=160&var36=1&var37=50&var38=50&var39=300&var40=80&var41=https%3A%2F%2Falisiecki.pl%2Fimages%2F300x80.png&var42=eu1.fastcast4u.com&var43=1938"></script>
                </div>
                <div class="player__button__bg">
                    <div class="player__button" id="play-button"><i class="fa-solid fa-play"></i></div>
                </div>

                <a class="greetings_panel greetings-trigger" href="#greetingsModal" data-greeting-channel="Kanał Trance"
                    data-greeting-accent="#00ccff">Pozdrów</a>
                <a class="schedule_panel schedule-trigger" href="#schedulePopup" data-schedule-channel="trance"
                    data-schedule-title="Kanał Trance" data-schedule-accent="#00ccff">Ramówka</a>
            </div>

            <!-- chill channel -->
            <div class="player-chill">

                <div class="player-chill__title">
                    <p>Kanał <span class="player-chill__color">Chill</span></p>
                </div>

                <div class="player-chill__stats">
                    <script type="text/javascript"
                        src="https://staty.portalradiowy.pl/wstats/wstats.php?var1=1&var2=13&var3=1&var4=1&var5=296&var6=FFFFFF&var7=1&var8=1&var9=13&var10=1&var11=24&var12=296&var13=FFFFFF&var14=1&var15=0&var16=14&var17=105&var18=1&var19=000000&var20=1&var27=0&var28=14&var29=1&var30=48&var31=100&var32=000000&var33=1&var34=0&var35=160&var36=1&var37=50&var38=50&var39=300&var40=80&var41=https%3A%2F%2Falisiecki.pl%2Fimages%2F300x80.png&var42=eu1.fastcast4u.com&var43=1942"></script>
                </div>

                <div class="player-chill__button__bg">
                    <div class="player-chill__button" id="play-button2"><i class="fa-solid fa-play"></i></div>
                </div>

                <a class="greetings_panel greetings-trigger" href="#greetingsModal" data-greeting-channel="Kanał Chill"
                    data-greeting-accent="#8dd80c">Pozdrów</a>
                <a class="schedule_panel schedule-trigger" href="#schedulePopup" data-schedule-channel="chill"
                    data-schedule-title="Kanał Chill" data-schedule-accent="#8dd80c">Ramówka</a>
            </div>

            <!-- rock channel -->
            <div class="player-rock">

                <div class="player-rock__title">
                    <p>Kanał <span class="player-rock__color">Rock</span></p>
                </div>

                <div class="player-rock__stats">
                    <script type="text/javascript"
                        src="https://staty.portalradiowy.pl/wstats/wstats.php?var1=1&var2=13&var3=1&var4=1&var5=296&var6=FFFFFF&var7=1&var8=1&var9=13&var10=1&var11=24&var12=296&var13=FFFFFF&var14=1&var15=0&var16=14&var17=105&var18=1&var19=000000&var20=1&var27=0&var28=14&var29=1&var30=48&var31=100&var32=000000&var33=1&var34=0&var35=160&var36=1&var37=50&var38=50&var39=300&var40=80&var41=https%3A%2F%2Falisiecki.pl%2Fimages%2F300x80.png&var42=eu1.fastcast4u.com&var43=2050"></script>
                </div>

                <div class="player-rock__button__bg">
                    <div class="player-rock__button" id="play-button3"><i class="fa-solid fa-play"></i></div>
                </div>

                <a class="greetings_panel greetings-trigger" href="#greetingsModal" data-greeting-channel="Kanał Rock"
                    data-greeting-accent="#da3636">Pozdrów</a>
                <a class="schedule_panel schedule-trigger" href="#schedulePopup" data-schedule-channel="rock"
                    data-schedule-title="Kanał Rock" data-schedule-accent="#da3636">Ramówka</a>
            </div>
        </section>
    </main>

    <div class="greetings-modal" id="greetingsModal" aria-hidden="true">
        <div class="greetings-modal__backdrop" data-greetings-close></div>
        <div class="greetings-modal__dialog" role="dialog" aria-modal="true"
            aria-labelledby="greetingsModalTitle">
            <button class="greetings-modal__close" type="button" aria-label="Zamknij okno"
                data-greetings-close><i class="fa-solid fa-xmark"></i></button>

            <p class="greetings-modal__eyebrow">Pozdrowienia</p>
            <h2 class="greetings-modal__title" id="greetingsModalTitle">Wyślij pozdrowienia</h2>
            <p class="greetings-modal__hint">Napisz krótką wiadomość dla słuchaczy i podpisz się na końcu.</p>

            <form class="greetings-modal__form" id="greetingsForm">
                <label class="greetings-modal__field">
                    <span>Treść pozdrowień</span>
                    <textarea id="greetingsMessage" name="message"
                        placeholder="Hej ShowFM! Pozdrawiam całą ekipę i wszystkich słuchaczy..." rows="5"
                        maxlength="240" required></textarea>
                </label>

                <label class="greetings-modal__field">
                    <span>Podpis</span>
                    <input id="greetingsSignature" name="signature" type="text" placeholder="Np. Damian z Łodzi"
                        maxlength="40" required>
                </label>

                <p class="greetings-modal__feedback" id="greetingsFeedback" aria-live="polite"></p>

                <div class="greetings-modal__actions">
                    <button class="greetings-modal__button greetings-modal__button--ghost" type="button"
                        data-greetings-close>Zamknij</button>
                    <button class="greetings-modal__button" type="submit">Wyślij pozdrowienia</button>
                </div>
            </form>
        </div>
    </div>

    <div class="schedule-popup" id="schedulePopup" aria-hidden="true">
        <div class="schedule-popup__backdrop" data-schedule-close></div>
        <div class="schedule-popup__dialog" role="dialog" aria-modal="true" aria-labelledby="schedulePopupTitle">
            <button class="schedule-popup__close" type="button" aria-label="Zamknij okno"
                data-schedule-close><i class="fa-solid fa-xmark"></i></button>

            <p class="schedule-popup__eyebrow">Ramówka</p>
            <h2 class="schedule-popup__title" id="schedulePopupTitle">Ramówka kanału</h2>
            <p class="schedule-popup__hint">Sprawdź przykładowy rozkład audycji dla wybranego kanału.</p>

            <div class="schedule-popup__content" id="schedulePopupContent"></div>
        </div>
    </div>

    <script src="./js/schedule.js"></script>
    <script src="./js/players.js"></script>
</body>

</html>
